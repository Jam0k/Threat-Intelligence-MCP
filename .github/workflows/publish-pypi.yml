name: Publish threatcluster-mcp to PyPI

# Tag push like v0.1.0. The tag must match python/pyproject.toml (and node/package.json).
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    name: Build wheel and sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify tag matches package versions
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          py=$(python -c "import tomllib;print(tomllib.load(open('python/pyproject.toml','rb'))['project']['version'])")
          js=$(python -c "import json;print(json.load(open('node/package.json'))['version'])")
          if [ "$tag" != "$py" ] || [ "$tag" != "$js" ]; then
            echo "::error ::tag $tag vs pyproject $py vs package.json $js"; exit 1; fi
      - run: python3 tools/sync_tools.py --check
      - run: python -m pip install --upgrade build
      - run: python -m build python/ --outdir dist/
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI (Trusted Publishing)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/threatcluster-mcp
    permissions:
      id-token: write   # OIDC for PyPI Trusted Publishing; no API token stored anywhere
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
