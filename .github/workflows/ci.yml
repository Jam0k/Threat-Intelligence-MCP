name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  spec:
    name: Spec copies in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/sync_tools.py --check

  python:
    name: Python ${{ matrix.python }} (pytest)
    runs-on: ubuntu-latest
    needs: spec
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The replay/parity tests drive the node server too when it is built.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the node server for the parity tests
        working-directory: node
        run: npm ci && npm run build
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e "python/[test]"
      - name: Test
        working-directory: python
        run: pytest -q
      - name: Package builds
        run: python -m pip install build && python -m build python/ --outdir dist-check

  node:
    name: Node ${{ matrix.node }} (node --test)
    runs-on: ubuntu-latest
    needs: spec
    strategy:
      matrix:
        node: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: node/package-lock.json
      - working-directory: node
        run: npm ci
      - working-directory: node
        run: npm test
      - name: Pack contents
        working-directory: node
        run: npm pack --dry-run
