name: Publish to MCP Registry

# Publishes listings/server.json to the official MCP registry
# (registry.modelcontextprotocol.io). Run manually AFTER the npm and PyPI
# releases for the version in server.json are live: the registry validates
# package ownership against the published artifacts (package.json mcpName,
# PyPI README mcp-name marker).
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher --version

      - name: Login (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: |
          cp listings/server.json server.json
          ./mcp-publisher publish
